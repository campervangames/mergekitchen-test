    <style>
      /* Unity's template pins the desktop canvas to 540x960px inline, which clips any window
         shorter than that. Fit it to the window height at the game's 9:16 instead; the game's own
         CanvasScaler handles whatever aspect results. Phones use the template's mobile branch
         (class unity-mobile), which already fills the screen, so this is desktop-only. */
      html, body { margin: 0; height: 100%; background: #146e78; overflow: hidden; }
      #unity-container.unity-desktop { position: fixed; inset: 0; width: auto; height: auto; transform: none; left: 0; top: 0; display: flex; align-items: center; justify-content: center; }
      #unity-container.unity-desktop #unity-canvas { width: auto !important; height: 100vh !important; max-width: 100vw; aspect-ratio: 9 / 16; background: #146e78; }
      #unity-container.unity-desktop #unity-footer { display: none; }
    </style>
    <script>
      // Error capture for phones, where there is no console. Unity's runtime runs from a blob:
      // URL, so window.onerror only ever sees "Script error." - but the runtime prints the real
      // exception through console.error first. Keep the last 20 such lines in localStorage and,
      // when the page is opened with ?debug, show them in an overlay that can be copied.
      (function () {
        var KEY = 'mk.errors', MAX = 20;
        function load() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }
        function push(kind, text) {
          try {
            var list = load(); list.push(new Date().toISOString() + ' ' + kind + ': ' + String(text).slice(0, 2000));
            while (list.length > MAX) list.shift();
            localStorage.setItem(KEY, JSON.stringify(list));
          } catch (e) {}
        }
        var origError = console.error.bind(console);
        console.error = function () { push('console.error', Array.prototype.map.call(arguments, function (a) { return a && a.stack ? a.stack : a; }).join(' ')); origError.apply(console, arguments); };
        // Registered first and in the capture phase, so it runs before Unity's own handler.
        // An opaque "Script error." (no file, no stack - the browser withholds detail for the
        // runtime's blob: script) is recorded but NOT passed on: Unity's handler turns it into a
        // modal alert that interrupts play for something it cannot even describe. Anything with
        // detail still reaches Unity's handler as before.
        window.addEventListener('error', function (e) {
          var opaque = (e.message === 'Script error.' || e.message === 'Script error') && !e.filename && !(e.error && e.error.stack);
          push('error', (e.message || '') + ' @ ' + (e.filename || '') + ':' + e.lineno + (e.error && e.error.stack ? '\n' + e.error.stack : '') + (opaque ? ' (suppressed alert)' : ''));
          if (opaque) { e.stopImmediatePropagation(); e.preventDefault(); }
        }, true);
        // Unity keeps saved data in IndexedDB (IDBFS). Safari can lose that connection when the
        // system UI comes over the page and then throw from inside a callback, which is exactly
        // the shape of an opaque "Script error.". Wrap the callback setters so such a throw is
        // logged with its stack before it propagates.
        function wrapSetter(proto, name) {
          if (!proto) return;
          var desc = Object.getOwnPropertyDescriptor(proto, name);
          if (!desc || !desc.set) return;
          Object.defineProperty(proto, name, { configurable: true, get: desc.get, set: function (fn) {
            desc.set.call(this, typeof fn !== 'function' ? fn : function (ev) {
              try { return fn.call(this, ev); }
              catch (err) { push('idb ' + name, (err && err.stack) || err); throw err; }
            });
          } });
        }
        if (window.IDBRequest) ['onsuccess', 'onerror'].forEach(function (n) { wrapSetter(IDBRequest.prototype, n); });
        if (window.IDBOpenDBRequest) ['onupgradeneeded', 'onblocked'].forEach(function (n) { wrapSetter(IDBOpenDBRequest.prototype, n); });
        if (window.IDBTransaction) ['oncomplete', 'onerror', 'onabort'].forEach(function (n) { wrapSetter(IDBTransaction.prototype, n); });
        if (window.IDBDatabase) ['onversionchange', 'onclose', 'onerror', 'onabort'].forEach(function (n) { wrapSetter(IDBDatabase.prototype, n); });
        window.addEventListener('unhandledrejection', function (e) { push('rejection', e.reason && e.reason.stack ? e.reason.stack : e.reason); });
        document.addEventListener('visibilitychange', function () { push('visibility', document.visibilityState); });
        if (/[?&]debug/.test(location.search)) {
          window.addEventListener('DOMContentLoaded', function () {
            var box = document.createElement('div');
            box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:55%;overflow:auto;background:rgba(0,0,0,.92);color:#ffd;font:12px/1.4 Menlo,monospace;padding:8px;z-index:99999;white-space:pre-wrap;word-break:break-word';
            var list = load();
            var build = document.querySelector('meta[name="mk-build"]');
            box.textContent = 'build: ' + (build ? build.content : 'unknown') + '\n\n' + (list.length ? list.join('\n\n') : 'no errors recorded yet');
            var bar = document.createElement('div'); bar.style.cssText = 'position:sticky;top:0;background:#222;padding:4px 0 8px';
            var copy = document.createElement('button'); copy.textContent = 'Copy log'; copy.onclick = function () { navigator.clipboard && navigator.clipboard.writeText(box.textContent); };
            var clear = document.createElement('button'); clear.textContent = 'Clear'; clear.style.marginLeft = '8px'; clear.onclick = function () { localStorage.removeItem(KEY); box.textContent = 'cleared'; };
            bar.appendChild(copy); bar.appendChild(clear); box.prepend(bar);
            document.body.appendChild(box);
          });
        }
      })();
    </script>

  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=540 height=960 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">game-01</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/2cbe4da2f60f4aaed2d4324ce62aa7f7.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/fe809ef8fad4f2d403336018ed5596d2.data.unityweb",
        frameworkUrl: buildUrl + "/2691d23ae46bb37ba807c31f67ad7fe0.framework.js.unityweb",
        codeUrl: buildUrl + "/f3dcbcee1a7bcfa86d525923cd6a5c98.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "game-01",
        productVersion: "0.1.420",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "540px";
        canvas.style.height = "960px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
